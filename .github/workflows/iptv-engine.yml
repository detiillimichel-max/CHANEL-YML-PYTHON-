name: IPTV Engine
on:
  push:
    branches: [develop]
    paths:
      - "engine/iptv/**"
      - "engine/common/**"
      - "requirements.txt"
      - ".github/workflows/iptv-engine.yml"
  workflow_dispatch:
    inputs:
      max_repositories:
        description: "Máximo de repositórios"
        required: true
        default: "2"
        type: string
      max_playlists:
        description: "Máximo de playlists"
        required: true
        default: "5"
        type: string
      max_channels:
        description: "Máximo de registros"
        required: true
        default: "50"
        type: string
  schedule:
    - cron: "23 */12 * * *"
permissions:
  contents: write
concurrency:
  group: iptv-catalog
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Discover IPTV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPTV_GITHUB_QUERY: ${{ vars.IPTV_GITHUB_QUERY }}
        run: |
          python -m engine.iptv.main \
            --max-repositories "${{ inputs.max_repositories || '2' }}" \
            --max-playlists "${{ inputs.max_playlists || '5' }}" \
            --max-channels "${{ inputs.max_channels || '50' }}"
      - name: Commit only IPTV catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/iptv/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(iptv): update IPTV catalog"
            git push origin HEAD:develop
          else
            echo "IPTV catalog unchanged."
          fi
