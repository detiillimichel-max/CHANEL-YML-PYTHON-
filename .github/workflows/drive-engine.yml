name: Google Drive Engine
on:
  workflow_dispatch:
    inputs:
      max_results:
        description: "Máximo de arquivos a catalogar"
        required: true
        default: "5"
        type: string
  schedule:
    - cron: "41 5 * * *"
permissions:
  contents: write
concurrency:
  group: drive-catalog
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Discover Google Drive links
        env:
          SEARXNG_BASE_URL: ${{ vars.SEARXNG_BASE_URL }}
          DRIVE_QUERIES: ${{ vars.DRIVE_QUERIES }}
        run: python -m engine.drive.main --max-results "${{ inputs.max_results || '5' }}"
      - name: Commit only Drive catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/drive/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(drive): update Drive catalog"
            git push origin HEAD:develop
          else
            echo "Drive catalog unchanged."
          fi
