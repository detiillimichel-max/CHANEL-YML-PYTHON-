name: Publish CHANEL Pages
on:
  push:
    branches: [develop]
    paths:
      - "web/**"
      - "data/**"
      - "index.html"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p .pages
          cp index.html .pages/index.html
          cp -R web .pages/web
          cp -R data .pages/data
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
